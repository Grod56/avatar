name: 'build package'
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - '**'

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      - name: Installing Dependencies
        run: |
          npm ci

      - name: Validation and Testing
        run: |
          npm run validate --prod
          npm run make
          npm run test
